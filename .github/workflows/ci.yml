name: Backend CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Un seul run à la fois par branche. Deux fusions rapprochées sur main lançaient
# deux déploiements simultanés sur le même serveur, donc deux `alembic upgrade
# head` en parallèle sur la même base : c'est ce qui a fait échouer le run #85
# (collision sur la création du type classroom_exercise_kind_enum) alors que le
# schéma était bien appliqué par l'autre run.
#
# cancel-in-progress: false est délibéré — on veut que le second déploiement
# ATTENDE la fin du premier, jamais qu'il l'interrompe en pleine migration.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:latest
          cache-to: type=inline

  deploy-staging:
    name: Deploy — staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://api.staging.malayka.co/api/docs
    steps:
      - uses: actions/checkout@v4

      # Le pipeline ne déployait jusqu'ici que l'image applicative : les
      # fichiers docker-compose*.yml du serveur étaient copiés une seule fois,
      # à la main, lors du tout premier déploiement (cf. scripts/first-deploy.sh)
      # et plus jamais mis à jour ensuite. Un correctif d'infra committé dans
      # ce repo ne prenait donc jamais effet en production — c'est ce qui a
      # provoqué l'incident du port 6379 déjà « corrigé » dans git mais jamais
      # présent sur le serveur qui exécute réellement Docker.
      #
      # .env / .env.staging sont volontairement EXCLUS : ils contiennent les
      # vrais secrets du serveur, jamais les gabarits versionnés dans ce repo.
      - name: Sync docker-compose files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docker-compose.yml,docker-compose.staging.yml"
          target: ${{ secrets.DEPLOY_PATH }}
          strip_components: 0

      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            IMAGE="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            cd ${{ secrets.DEPLOY_PATH }}
            docker pull "${IMAGE}:develop"
            # --no-deps : staging ne doit jamais recréer db/redis, partagés avec
            # la production. Sans ce drapeau, Compose les recrée à chaque
            # alternance prod/staging (l'étiquette config_files change) et le
            # redémarrage de redis échouait sur un conflit de port.
            # --remove-orphans : nettoie les conteneurs d'anciens noms de
            # service (ex. backend-backend-staging-1) que Compose signalait
            # sans les retirer.
            BACKEND_IMAGE="${IMAGE}" IMAGE_TAG=develop \
              docker compose -f docker-compose.yml -f docker-compose.staging.yml \
              up -d --no-build --no-deps --remove-orphans backend-staging
            docker compose -f docker-compose.yml -f docker-compose.staging.yml \
              exec -T backend-staging alembic upgrade head
            docker image prune -f

  deploy-production:
    name: Deploy — production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://api.malayka.co/api/docs
    steps:
      - uses: actions/checkout@v4

      # Voir le commentaire équivalent dans deploy-staging : sans cette étape,
      # aucun changement d'infra committé ici n'atteint jamais le serveur.
      - name: Sync docker-compose files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docker-compose.yml,docker-compose.staging.yml"
          target: ${{ secrets.DEPLOY_PATH }}
          strip_components: 0

      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            IMAGE="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            cd ${{ secrets.DEPLOY_PATH }}
            docker pull "${IMAGE}:latest"
            BACKEND_IMAGE="${IMAGE}" IMAGE_TAG=latest \
              docker compose up -d --no-build --remove-orphans backend
            docker compose exec -T backend alembic upgrade head
            docker image prune -f

            # Diagnostic conservé dans les logs du run : si un port venait à
            # nouveau se heurter à un processus externe à ce projet Compose,
            # cette ligne identifie le responsable sans rien arrêter de force.
            echo "--- État des conteneurs après déploiement ---"
            docker compose ps
