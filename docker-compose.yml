services:

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: malaykaa
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - malaykaa_net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Pas de publication de port sur l'hôte : redis n'est joint qu'en interne
    # via malaykaa_net (REDIS_URL=redis://redis:6379/...). Publier 6379 exposait
    # un redis sans mot de passe sur 0.0.0.0 et provoquait des collisions de port
    # à chaque recréation du conteneur.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - malaykaa_net
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE:-malaykaa-backend}:${IMAGE_TAG:-latest}
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - malaykaa_net
    restart: unless-stopped

volumes:
  pg_data:

networks:
  malaykaa_net:
    name: malaykaa_net
    driver: bridge
