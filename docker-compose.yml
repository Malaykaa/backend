services:

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: malaykaa
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - malaykaa_net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Pas de publication de port sur l'hôte : redis n'est joint qu'en interne
    # via malaykaa_net (REDIS_URL=redis://redis:6379/...). Publier 6379 exposait
    # un redis sans mot de passe sur 0.0.0.0 et provoquait des collisions de port
    # à chaque recréation du conteneur.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - malaykaa_net
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE:-malaykaa-backend}:${IMAGE_TAG:-latest}
    env_file: .env

    # Redis est joint par son nom de service sur malaykaa_net. Cette valeur est
    # fixée ici, et non déléguée au .env, parce qu'elle dépend de la topologie
    # décrite dans CE fichier : le conteneur redis n'expose aucun port sur
    # l'hôte, "localhost" ne peut donc jamais l'atteindre depuis le backend.
    # Un `environment:` prend le pas sur `env_file:`, ce qui neutralise une
    # valeur devenue incorrecte côté serveur.
    #
    # Symptôme corrigé : /health/ready renvoyait "redis":"error" en production.
    # Conséquences silencieuses — la déconnexion ne révoquait plus rien
    # (token_blacklist.revoke sort sans agir si Redis est absent, et
    # BLACKLIST_FAIL_CLOSED vaut false par défaut), et les codes OTP
    # d'inscription retombaient sur un stockage en mémoire du processus.
    #
    # À adapter si Redis devient un service managé externe.
    environment:
      REDIS_URL: redis://redis:6379/0

    # Pas de publication de port sur l'hôte : nginx ("frontend", cf. son
    # docker-compose.yml) atteint ce service via malaykaa_net par résolution
    # DNS interne (proxy_pass http://backend:8000) — backend-staging fait
    # déjà ainsi sans publier de port, la preuve que ce n'est pas nécessaire.
    #
    # Fermer cet accès direct est la condition de sécurité qui rend sûr le
    # --forwarded-allow-ips='*' ajouté au Dockerfile : tant que le port était
    # public, quiconque le contactait directement pouvait usurper n'importe
    # quelle IP via un en-tête X-Forwarded-For forgé.

    # Les pièces jointes (CV, documents de cours déposés par les enseignants)
    # étaient écrites dans le système de fichiers du conteneur, sans volume.
    # Or le déploiement recrée le conteneur à chaque fois : tous les fichiers
    # envoyés étaient donc détruits à chaque mise en production, alors que
    # leurs lignes en base subsistaient — l'utilisateur voyait un document
    # listé mais introuvable au téléchargement.
    #
    # WORKDIR vaut /app (cf. Dockerfile) et ATTACHMENTS_DIR vaut
    # "storage/attachments" par défaut, chemin relatif : les fichiers
    # atterrissent donc dans /app/storage/attachments. On monte le parent pour
    # couvrir aussi un éventuel sous-répertoire ajouté plus tard.
    volumes:
      - attachments_data:/app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - malaykaa_net
    restart: unless-stopped

volumes:
  pg_data:
  attachments_data:

networks:
  malaykaa_net:
    name: malaykaa_net
    driver: bridge
