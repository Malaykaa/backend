[tool.poetry]
name = "malaykaa-backend"
version = "0.1.0"
description = "Backend FastAPI pour Malaykaa — moteur d'exécution et d'opportunités"
authors = ["Malaykaa"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
# fastapi 0.120+ requis pour supporter starlette 0.49 (CVE-2025-62727, CVE-2025-54121)
fastapi = "^0.120.4"
# Pin explicite des deps transitives vulnérables (déterminisme Docker)
starlette = ">=0.49.1,<0.50"
urllib3 = ">=2.6.3,<3"
# cryptography 46.0.6 corrige CVE-2026-26007 (validation clé pub) et CVE-2026-34073 (DNS name constraints TLS)
cryptography = ">=46.0.6,<47"
# requests 2.33.0 corrige CVE-2026-25645 (filename prédictible dans extract_zipped_paths)
requests = ">=2.33.0,<3"
uvicorn = { extras = ["standard"], version = "^0.34.0" }
pydantic = "^2.9.0"
pydantic-settings = "^2.5.0"
SQLAlchemy = "^2.0.36"
alembic = "^1.14.0"
psycopg2-binary = "^2.9.10"
# pgvector : type Vector côté ORM + binding psycopg2 pour la recherche sémantique
pgvector = "^0.3.6"
python-jose = { extras = ["cryptography"], version = "^3.3.0" }
# bcrypt utilisé directement dans app/core/security.py (sans passlib)
bcrypt = "^4.2.0"
openai = "^1.58.0"  # borne supérieure <2 héritée du caret ^
google-genai = "^1.0.0"
anthropic = "^0.95.0"
# python-multipart 0.0.26 corrige CVE-2026-40347 (DoS multipart) et CVE-2026-24486 (path traversal)
python-multipart = "^0.0.26"
httpx = "^0.28.1"
structlog = "^24.4.0"
email-validator = "^2.1.0"
apscheduler = "^3.10.0"
apify-client = "^2.5.0"
redis = "^5.2.0"
twilio = "^9.4.0"
slowapi = "^0.1.9"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
ruff = "^0.8.0"
black = "^24.10.0"
mypy = "^1.13.0"
# Tests d'intégration : Postgres éphémère via Docker
testcontainers = { extras = ["postgres"], version = "^4.8.0" }

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
